[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "read-office-documents-mcp"
version = "0.1.0"
description = "MCP server for reading office documents, with Excel sheet selection support."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "pandas",
    "openpyxl",
    "mcp-server",
    "starlette",
    "uvicorn",
    "PyPDF2",
    "python-pptx",
    "python-docx",
    "markdownify"
]
readme = "README.md"
requires-python = ">=3.8"
